apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: questlog-db
  namespace: questlog
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  postgresql:
    parameters:
      wal_keep_size: 64MB
      max_wal_size: 256MB
  storage:
    size: 1Gi
    storageClass: longhorn
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 250m
  bootstrap:
    initdb:
      database: questlog
      owner: questlog
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://postgres-backups/questlog-cnpg
      endpointURL: http://minio.minio-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: questlog-db-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: questlog-db-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
