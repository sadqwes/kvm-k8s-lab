# ArgoCD: репозиторий лабы публичный — регистрируем только адрес, без логина и токена.
# Токен здесь не нужен и вреден: просроченный или перевыпущенный токен ломает чтение публичного репо (16.10.2026).
apiVersion: v1
kind: Secret
metadata:
  name: kvm-k8s-lab-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/sadqwes/kvm-k8s-lab.git
