{{- /* service.yaml — постоянный адрес для подов: ingress ходит на порт http, Prometheus — на metrics. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goapp.name" . }}
  labels:
    {{- include "goapp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "goapp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http      # имя порта из Deployment, а не число — меняешь порт в одном месте
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
