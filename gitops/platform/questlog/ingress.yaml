apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: questlog
  namespace: questlog
  annotations:
    # Вход — в самом приложении (сессия в cookie), здесь только принудительный https
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # Без secretName ingress-nginx берёт сертификат по умолчанию: ingress-nginx/tls-wildcard (mkcert).
  # Перевыпуск — scripts/reissue-wildcard-tls.sh. На неделе 2 заменим на cert-manager.
  tls:
    - hosts:
        - questlog.local
  rules:
    - host: questlog.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: questlog
                port:
                  name: http
