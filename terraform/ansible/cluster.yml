---
# Идемпотентное создание кластера K8s на чистых VM.
# Запуск: ansible-playbook -i ansible/inventory.ini ansible/cluster.yml

- name: Подготовка всех узлов
  hosts: all
  become: true
  tasks:
    - name: Модуль br_netfilter + автозагрузка
      shell: modprobe br_netfilter && echo br_netfilter > /etc/modules-load.d/k8s.conf

    - name: sysctl для K8s
      copy:
        dest: /etc/sysctl.d/99-k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      register: sysctl_conf

    - name: Применить sysctl
      shell: sysctl --system
      when: sysctl_conf.changed

    - name: Базовые пакеты + containerd
      apt:
        update_cache: true
        name: [apt-transport-https, ca-certificates, curl, gpg, containerd]

    - name: Ключ Kubernetes apt
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        chmod 644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Репозиторий Kubernetes 1.31
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /\n"

    - name: kubelet/kubeadm/kubectl
      apt:
        update_cache: true
        name: [kubelet, kubeadm, kubectl]
      register: kube_pkgs

    - name: Зафиксировать версии
      shell: apt-mark hold kubelet kubeadm kubectl

    - name: containerd с SystemdCgroup
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        systemctl restart containerd
      args:
        creates: /etc/containerd/config.toml

- name: Инициализация control plane
  hosts: k8s-control-plane
  become: true
  tasks:
    - name: Уже инициализирован?
      stat:
        path: /etc/kubernetes/admin.conf
      register: cp_done

    - name: kubeadm init
      shell: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_host }}
      when: not cp_done.stat.exists

    - name: CNI (flannel)
      shell: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      when: not cp_done.stat.exists

    - name: Команда join для воркеров
      shell: kubeadm token create --print-join-command
      register: join_cmd

- name: Присоединение воркеров
  hosts: all
  become: true
  tasks:
    - name: Уже в кластере?
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: joined

    - name: kubeadm join
      shell: "{{ hostvars['k8s-control-plane']['join_cmd'].stdout }}"
      when:
        - inventory_hostname != 'k8s-control-plane'
        - not joined.stat.exists
