name: lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit yamllint ansible-lint
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false
      - uses: azure/setup-helm@v4
      - run: pre-commit run --from-ref ${{ github.event.pull_request.base.sha || github.event.before }} --to-ref ${{ github.sha }} --show-diff-on-failure

