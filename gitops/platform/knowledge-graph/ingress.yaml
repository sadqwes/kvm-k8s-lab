apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-graph
  namespace: knowledge
spec:
  ingressClassName: nginx
  rules:
    - host: knowledge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledge-graph-api
                port:
                  number: 8080
