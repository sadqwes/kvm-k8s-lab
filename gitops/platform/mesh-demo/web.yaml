apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mesh-demo
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 80
      targetPort: 80
