apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sadqwes/kvm-k8s-lab.git
    targetRevision: main
    path: gitops/platform/mesh-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: mesh-demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
