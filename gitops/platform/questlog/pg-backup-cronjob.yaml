apiVersion: batch/v1
kind: CronJob
metadata:
  name: questlog-pg-backup
  namespace: questlog
spec:
  schedule: "0 12 * * *"
  timeZone: "Europe/Minsk"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          volumes:
            - name: dump
              emptyDir: {sizeLimit: 1Gi}
            - name: tmp
              emptyDir: {}
          initContainers:
            - name: pg-dump
              image: postgres:18.6-alpine
              command: ["sh", "-c", "date +%s > /dump/START && pg_dump --format=custom --file=/dump/questlog.dump && ls -l /dump"]
              env:
                - {name: PGHOST, value: questlog-postgres-postgresql}
                - {name: PGUSER, value: questlog}
                - {name: PGDATABASE, value: questlog}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: questlog-postgres-creds, key: password}}
              volumeMounts: [{name: dump, mountPath: /dump}]
              securityContext:
                runAsUser: 70
                runAsGroup: 70
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          containers:
            - name: upload
              image: amazon/aws-cli:2.31.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  KEY="questlog/questlog-$(date -u +%Y-%m-%dT%H%M%SZ).dump"
                  aws s3 cp /dump/questlog.dump "s3://postgres-backups/$KEY"
                  # Храним 14 дней. Не lifecycle-правилом: MinIO 2023 требует Content-MD5,
                  # а aws-cli 2.23+ шлёт CRC32 → MissingContentMD5. Удаляем старые сами.
                  CUTOFF=$(date -u -d "14 days ago" +%Y-%m-%dT%H:%M:%S)
                  OLD=$(aws s3api list-objects-v2 --bucket postgres-backups --prefix questlog/ \
                    --query "Contents[?LastModified<\`$CUTOFF\`].Key" --output text)
                  PRUNED=0
                  for k in $OLD; do
                    [ "$k" = "None" ] && continue   # пустой список aws-cli печатает как None
                    aws s3 rm "s3://postgres-backups/$k"
                    PRUNED=$((PRUNED + 1))
                  done
                  LS=$(aws s3 ls s3://postgres-backups/questlog/ --summarize)
                  echo "$LS"
                  # Метрики для Grafana (дашборд «Backups: questlog Postgres»).
                  # Пушим только после успеха: если бэкап упал, «возраст» растёт.
                  # Pushgateway недоступен → бэкап всё равно считается успешным.
                  NOW=$(date +%s)
                  cat <<EOF | curl -fsS --max-time 10 --data-binary @- "$PUSHGATEWAY_URL/metrics/job/questlog_pg_backup" || echo "warn: push to Pushgateway failed"
                  questlog_pg_backup_last_success_timestamp_seconds $NOW
                  questlog_pg_backup_duration_seconds $((NOW - $(cat /dump/START)))
                  questlog_pg_backup_size_bytes $(stat -c %s /dump/questlog.dump)
                  questlog_pg_backup_objects $(echo "$LS" | awk '/Total Objects:/ {print $3}')
                  questlog_pg_backup_bucket_bytes $(echo "$LS" | awk '/Total Size:/ {print $3}')
                  questlog_pg_backup_pruned $PRUNED
                  EOF
              env:
                - {name: AWS_ENDPOINT_URL, value: "http://minio.minio-system.svc.cluster.local:9000"}
                - {name: AWS_DEFAULT_REGION, value: us-east-1}
                - {name: AWS_ACCESS_KEY_ID, value: pgbackup}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: questlog-backup-s3, key: secretKey}}
                - {name: HOME, value: /tmp}
                - {name: PUSHGATEWAY_URL, value: "http://pushgateway.monitoring.svc.cluster.local:9091"}
              volumeMounts:
                - {name: dump, mountPath: /dump, readOnly: true}
                - {name: tmp, mountPath: /tmp}
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}