# Postgres для english-polygon — простой StatefulSet на официальном образе postgres.
# Как у jobhunter.
apiVersion: v1
kind: Service
metadata:
  name: english-polygon-postgres
  namespace: english-polygon
  labels: {app: english-polygon-postgres}
spec:
  clusterIP: None # headless: у пода StatefulSet стабильное DNS-имя english-polygon-postgres-0.english-polygon-postgres
  selector: {app: english-polygon-postgres}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: english-polygon-postgres
  namespace: english-polygon
spec:
  serviceName: english-polygon-postgres
  replicas: 1
  selector:
    matchLabels: {app: english-polygon-postgres}
  template:
    metadata:
      labels: {app: english-polygon-postgres}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres в alpine-образе
        runAsGroup: 70
        fsGroup: 70 # том Longhorn будет доступен группе postgres
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: english}
            - {name: POSTGRES_DB, value: english}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: english-polygon-postgres, key: password}
          volumeMounts:
            # с postgres 18 том монтируют на /var/lib/postgresql, данные лежат в 18/docker внутри
            - {name: data, mountPath: /var/lib/postgresql}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "english", "-d", "english"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "english", "-d", "english"]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
