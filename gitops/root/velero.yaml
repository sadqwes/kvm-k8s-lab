apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts/
    chart: velero
    targetRevision: "7.2.1"
    helm:
      releaseName: velero
      values: |
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.11.1
            volumeMounts:
              - mountPath: /target
                name: plugins
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero-backups
              credential:
                name: velero-credentials
                key: cloud
              config:
                region: us-east-1
                s3ForcePathStyle: "true"
                s3Url: http://minio.minio-system.svc:9000
          volumeSnapshotLocation:
            - name: default
              provider: csi
        snapshotsEnabled: true
        # The schedule lives in Git (it used to be created by hand with `velero schedule create`,
        # and its TTL silently stayed at 720h). The chart names it velero-periodic-backup.
        schedules:
          periodic-backup:
            schedule: "0 */6 * * *"
            template:
              ttl: 168h
              storageLocation: default
              defaultVolumesToFsBackup: true
              # minio-system: the backup storage itself — backing it up into itself made
              #   every backup contain all previous ones (8.65 GiB per backup, MinIO 96%).
              # monitoring: Prometheus TSDB and Loki chunks — not restored, everything else is in Git.
              excludedNamespaces:
                - minio-system
                - monitoring
        # Velero server metrics (velero_backup_*) -> Prometheus.
        # release: prometheus is the label kube-prometheus-stack selects ServiceMonitors by.
        metrics:
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus
        deployNodeAgent: true
        nodeAgent:
          privileged: true
        kubectl:
          image:
            repository: rancher/kubectl
            tag: v1.31.14
        upgradeCRDs: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
