apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-creds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sadqwes/kvm-k8s-lab.git
    targetRevision: main
    path: gitops/platform/velero
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
