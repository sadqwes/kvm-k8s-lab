apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-graph
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sadqwes/kvm-k8s-lab.git
    targetRevision: main
    path: gitops/platform/knowledge-graph
  destination:
    server: https://kubernetes.default.svc
    namespace: knowledge
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: ["CreateNamespace=true"]
