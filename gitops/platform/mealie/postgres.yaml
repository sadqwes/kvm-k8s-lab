apiVersion: v1
kind: Service
metadata:
  name: mealie-postgres
  namespace: mealie
  labels: {app: mealie-postgres}
spec:
  clusterIP: None
  selector: {app: mealie-postgres}
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mealie-postgres
  namespace: mealie
spec:
  serviceName: mealie-postgres
  replicas: 1
  selector:
    matchLabels: {app: mealie-postgres}
  template:
    metadata:
      labels: {app: mealie-postgres}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: mealie
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-postgres
                  key: password
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mealie", "-d", "mealie"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "mealie", "-d", "mealie"]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi