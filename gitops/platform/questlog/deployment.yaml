apiVersion: apps/v1
kind: Deployment
metadata:
  name: questlog
  namespace: questlog
spec:
  replicas: 1
  selector:
    matchLabels: {app: questlog}
  template:
    metadata:
      labels: {app: questlog}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # nonroot из distroless; числовой UID нужен, чтобы kubelet мог проверить runAsNonRoot
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/sadqwes/questlog:365f535 # CI заменяет тег на короткий SHA коммита
          ports:
            - name: http
              containerPort: 8080
            - name: metrics # отдельный порт: в ingress не попадает, его скрейпит только Prometheus
              containerPort: 9090
          env:
            - name: PGHOST
              value: questlog-postgres-postgresql.questlog.svc.cluster.local
            - name: PGUSER
              value: questlog
            - name: PGDATABASE
              value: questlog
            - name: PGSSLMODE
              value: disable
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: questlog-postgres-creds
                  key: password
            - name: QUESTLOG_USER
              value: sadqwes
            - name: QUESTLOG_PASSWORD_HASH # bcrypt-хеш, сам пароль нигде не хранится
              valueFrom:
                secretKeyRef:
                  name: questlog-auth
                  key: password-hash
            - name: QUESTLOG_API_TOKEN # токен для наставника (Claude), отзывается сменой секрета
              valueFrom:
                secretKeyRef:
                  name: questlog-auth
                  key: api-token
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
