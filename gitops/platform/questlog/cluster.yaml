apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: questlog-db
  namespace: questlog
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 1Gi
    storageClass: longhorn
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 250m
  bootstrap:
    initdb:
      database: questlog
      owner: questlog
      import:
        type: microservice
        databases:
          - questlog
        source:
          externalCluster: questlog-old
  externalClusters:
    - name: questlog-old
      connectionParameters:
        host: questlog-postgres-postgresql.questlog.svc.cluster.local
        user: questlog
        dbname: questlog
        sslmode: disable
      password:
        name: questlog-postgres-creds
        key: password
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://postgres-backups/questlog-cnpg
      endpointURL: http://minio.minio-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: questlog-db-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: questlog-db-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
