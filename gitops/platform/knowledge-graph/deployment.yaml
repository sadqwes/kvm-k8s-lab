apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-graph-api
  namespace: knowledge
spec:
  replicas: 1
  selector:
    matchLabels: {app: knowledge-graph-api}
  template:
    metadata:
      labels: {app: knowledge-graph-api}
    spec:
      containers:
        - name: app
          image: ghcr.io/sadqwes/knowledge-graph-api:9358500
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://knowledge-postgres-postgresql.knowledge.svc.cluster.local:5432/kg
            - name: DB_USER
              value: kg
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: knowledge-postgres-creds
                  key: password
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
