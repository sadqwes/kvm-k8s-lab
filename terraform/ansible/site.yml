---
- name: Prepare nodes for Kubernetes
  hosts: k8s_cluster
  become: true
  vars:
    k8s_minor: "1.31"
  tasks:
    - name: Install base packages
      apt:
        name: 
          - containerd
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - conntrack    # <-- ДОБАВИЛИ (исправляет текущую ошибку)
          - socat        # <-- ДОБАВИЛИ (нужен для проброса портов kubectl)
          - ebtables     # <-- ДОБАВИЛИ (нужен для CNI)
          - ipset        # <-- ДОБАВИЛИ (нужен для kube-proxy)
        state: present
        update_cache: true

    - name: Generate containerd default config
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable systemd cgroup driver
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    - name: Add Kubernetes apt signing key
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key" \
          | gpg --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb /\n"

    - name: Install kubelet, kubeadm, kubectl
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    - name: Disable ICMP redirects for MetalLB L2
      sysctl:
        name: "{{ item }}"
        value: '0'
        sysctl_set: true
        state: present
        reload: true
      loop:
        - net.ipv4.conf.all.send_redirects
        - net.ipv4.conf.default.send_redirects
        - net.ipv4.conf.ens3.send_redirects

  handlers:
    - name: restart containerd
      service:
        name: containerd
        state: restarted

- name: Initialize control plane
  hosts: control_plane
  become: true
  vars:
    pod_cidr: "10.244.0.0/16"
  tasks:
    - name: Check if already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: kubeadm init
      shell: |
        kubeadm init \
          --pod-network-cidr={{ pod_cidr }} \
          --control-plane-endpoint={{ ansible_host }}:6443 \
          --apiserver-advertise-address={{ ansible_host }}
      when: not admin_conf.stat.exists

    - name: Prepare .kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy admin.conf to ubuntu kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu

    - name: Install Flannel CNI
      shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: not admin_conf.stat.exists

- name: Generate join command
  hosts: control_plane
  become: true
  tasks:
    - name: Create fresh join command
      shell: kubeadm token create --print-join-command
      register: join_cmd_raw
    - name: Publish join command
      set_fact:
        join_cmd: "{{ join_cmd_raw.stdout }}"

- name: Join workers
  hosts: workers
  become: true
  tasks:
    - name: Check if already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join cluster
      shell: "{{ hostvars[groups['control_plane'][0]].join_cmd }}"
      when: not kubelet_conf.stat.exists

- name: Fetch kubeconfig to operator machine
  hosts: control_plane
  become: true
  tasks:
    - name: Download admin.conf locally
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/.kube/lab-config"
        flat: true