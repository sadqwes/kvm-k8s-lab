apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.5
    helm:
      releaseName: knowledge-postgres
      values: |
        auth:
          username: kg
          database: kg
          existingSecret: kg-postgres-creds
        primary:
          persistence:
            size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: knowledge
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: ["CreateNamespace=true"]
