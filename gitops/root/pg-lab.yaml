apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sadqwes/kvm-k8s-lab.git
    targetRevision: main
    path: gitops/platform/pg-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: pg-lab
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ "CreateNamespace=true" ]
