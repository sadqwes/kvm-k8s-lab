apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: "0.29.1"   # оператор 1.30.1 — последняя версия на сегодня
    helm:
      releaseName: cnpg
    destination:
      server: https://kubernetes.default.svc
      namespace: cnpg-system
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true   # у CRD оператора огромные схемы — обычный apply упрётся в лимит аннотации