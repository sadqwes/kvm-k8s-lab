apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: questlog
  namespace: questlog
  annotations:
    # Логин и пароль на весь сайт: приложение само авторизацию не делает
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: questlog-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "questlog"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true" # http → https, пароль не уходит открытым текстом
spec:
  ingressClassName: nginx
  # Без secretName ingress-nginx берёт сертификат по умолчанию: ingress-nginx/tls-wildcard (mkcert).
  # Перевыпуск — scripts/reissue-wildcard-tls.sh. На неделе 2 заменим на cert-manager.
  tls:
    - hosts:
        - questlog.local
  rules:
    - host: questlog.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: questlog
                port:
                  name: http
