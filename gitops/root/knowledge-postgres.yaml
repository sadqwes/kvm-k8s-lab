apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: postgresql
    targetRevision: "18.8.9"
    helm:
      releaseName: knowledge-postgres
      values: |
        auth:
          existingSecret: knowledge-postgres-creds
          username: kg
          database: kg
        primary:
          persistence:
            enabled: true
            storageClass: longhorn
            size: 2Gi
        readReplicas:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: knowledge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
